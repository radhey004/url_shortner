services:

  client:
    build: ./client
    ports:
      - "5173:4173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    ports:
      - "5000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3

  server1:
    build: ./server
    environment:
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      SERVER_ID: server1
    depends_on:
      - redis

  server2:
    build: ./server
    environment:
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      SERVER_ID: server2
    depends_on:
      - redis

  server3:
    build: ./server
    environment:
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5000
      SERVER_ID: server3
    depends_on:
      - redis

  redis:
    image: redis:alpine

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis